<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Low Balance Alert</title>
    <style>
        body { margin:0; padding:0; font-family:Arial,sans-serif; background:#f4f4f4; }
        .container { max-width:600px; margin:30px auto; background:#fff; border-radius:8px; overflow:hidden; }
        .header { background:#DC2626; padding:24px 32px; }
        .header h1 { color:#fff; margin:0; font-size:20px; }
        .content { padding:32px; color:#1e293b; line-height:1.6; }
        .alert-box { background:#fef2f2; border-left:4px solid #DC2626; padding:16px; border-radius:4px; margin:16px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>WiseWallet — Low Balance Alert</h1>
    </div>
    <div class="content">
        <h2>⚠ Your balance is running low</h2>
        <p>Hi <span th:text="${userName}">User</span>,</p>
        <p>We noticed your account balance has fallen below your configured threshold.</p>
        <div class="alert-box">
            <strong>Current Balance:</strong>
            <span th:text="${currentBalance}">0.00</span>
            <span th:text="${currency}">USD</span><br/>
            <strong>Threshold:</strong>
            <span th:text="${threshold}">100.00</span>
            <span th:text="${currency}">USD</span>
        </div>
        <p>Consider topping up your account to avoid transaction failures.</p>
    </div>
    <div th:replace="~{fragments/footer :: footer-fragment}"></div>
</div>
</body>
</html>
