<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Account Created</title>
    <style>
        body { margin:0; padding:0; font-family:Arial,sans-serif; background:#f4f4f4; }
        .container { max-width:600px; margin:30px auto; background:#fff; border-radius:8px; overflow:hidden; }
        .header { background:#2563EB; padding:24px 32px; }
        .header h1 { color:#fff; margin:0; font-size:20px; }
        .content { padding:32px; color:#1e293b; line-height:1.6; }
        .highlight { background:#eff6ff; border-left:4px solid #2563EB; padding:16px; border-radius:4px; margin:16px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>WiseWallet</h1>
    </div>
    <div class="content">
        <h2>Account Created Successfully</h2>
        <p>Hi <span th:text="${userName}">User</span>,</p>
        <p>Your new account has been created and is ready to use.</p>
        <div class="highlight">
            <strong>Account Type:</strong> <span th:text="${accountType}">CHECKING</span><br/>
            <strong>Currency:</strong> <span th:text="${currency}">USD</span>
        </div>
        <p>You can now deposit funds and start managing your finances with WiseWallet.</p>
    </div>
    <div th:replace="~{fragments/footer :: footer-fragment}"></div>
</div>
</body>
</html>
