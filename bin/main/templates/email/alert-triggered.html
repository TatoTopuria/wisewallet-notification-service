<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Financial Alert</title>
    <style>
        body { margin:0; padding:0; font-family:Arial,sans-serif; background:#f4f4f4; }
        .container { max-width:600px; margin:30px auto; background:#fff; border-radius:8px; overflow:hidden; }
        .header { background:#7C3AED; padding:24px 32px; }
        .header h1 { color:#fff; margin:0; font-size:20px; }
        .content { padding:32px; color:#1e293b; line-height:1.6; }
        .alert-box { background:#f5f3ff; border-left:4px solid #7C3AED; padding:16px; border-radius:4px; margin:16px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>WiseWallet — Financial Alert</h1>
    </div>
    <div class="content">
        <h2>Financial Alert Triggered</h2>
        <p>Hi <span th:text="${userName}">User</span>,</p>
        <p>A financial alert has been triggered for your account.</p>
        <div class="alert-box">
            <strong>Alert Type:</strong> <span th:text="${alertType}">BALANCE_LOW</span><br/>
            <strong>Current Balance:</strong>
            <span th:text="${currentBalance}">0.00</span>
            <span th:text="${currency}">USD</span>
        </div>
        <p>Please review your account and take the appropriate action.</p>
    </div>
    <div th:replace="~{fragments/footer :: footer-fragment}"></div>
</div>
</body>
</html>
