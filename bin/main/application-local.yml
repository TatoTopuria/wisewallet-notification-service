spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/notification_db
    username: postgres
    password: ${DB_PASSWORD:dev_password}
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    aws:
      endpoint: http://localhost:4566
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false

account:
  service:
    url: http://localhost:8081

wisewallet:
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key}

logging:
  level:
    com.wisewallet.notification: DEBUG
