<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Transaction Categorized</title>
    <style>
        body { margin:0; padding:0; font-family:Arial,sans-serif; background:#f4f4f4; }
        .container { max-width:600px; margin:30px auto; background:#fff; border-radius:8px; overflow:hidden; }
        .header { background:#2563EB; padding:24px 32px; }
        .header h1 { color:#fff; margin:0; font-size:20px; }
        .content { padding:32px; color:#1e293b; line-height:1.6; }
        .category-badge { display:inline-block; background:#dbeafe; color:#1d4ed8; padding:4px 12px; border-radius:16px; font-weight:bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>WiseWallet</h1>
    </div>
    <div class="content">
        <h2>Transaction Categorized</h2>
        <p>Hi <span th:text="${userName}">User</span>,</p>
        <p>Your transaction has been automatically categorized.</p>
        <p>Category: <span class="category-badge" th:text="${category}">FOOD</span></p>
        <p>Amount: <span th:text="${amount}">0.00</span> <span th:text="${currency}">USD</span></p>
    </div>
    <div th:replace="~{fragments/footer :: footer-fragment}"></div>
</div>
</body>
</html>
