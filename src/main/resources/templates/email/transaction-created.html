<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Transaction Recorded</title>
    <style>
        body { margin:0; padding:0; font-family:Arial,sans-serif; background:#f4f4f4; }
        .container { max-width:600px; margin:30px auto; background:#fff; border-radius:8px; overflow:hidden; }
        .header { background:#2563EB; padding:24px 32px; }
        .header h1 { color:#fff; margin:0; font-size:20px; }
        .content { padding:32px; color:#1e293b; line-height:1.6; }
        .detail-box { background:#f8fafc; border:1px solid #e2e8f0; padding:16px; border-radius:4px; margin:16px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>WiseWallet</h1>
    </div>
    <div class="content">
        <h2>Transaction Recorded</h2>
        <p>Hi <span th:text="${userName}">User</span>,</p>
        <p>A transaction has been recorded on your account.</p>
        <div class="detail-box">
            <strong>Type:</strong> <span th:text="${type}">DEBIT</span><br/>
            <strong>Amount:</strong>
            <span th:text="${amount}">0.00</span>
            <span th:text="${currency}">USD</span><br/>
            <strong>Status:</strong> <span th:text="${status}">COMPLETED</span>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer-fragment}"></div>
</div>
</body>
</html>
